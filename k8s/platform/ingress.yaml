apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: magickiosk-panel
  namespace: magickiosk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    # Panel şifreyle korunur; kullanıcı/şifre magickiosk-panel-auth secret'ında (htpasswd) tutulur.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: magickiosk-panel-auth
    nginx.ingress.kubernetes.io/auth-realm: "MagicPay Kiosk Panel"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - magickiosk-panel.magicpay.ai
      secretName: magickiosk-panel-tls
  rules:
    - host: magickiosk-panel.magicpay.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: magickiosk-panel
                port:
                  number: 80
