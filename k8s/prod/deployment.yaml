apiVersion: apps/v1
kind: Deployment
metadata:
  name: magiccoffee-panel
  namespace: magiccoffee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magiccoffee-panel
  template:
    metadata:
      labels:
        app: magiccoffee-panel
    spec:
      imagePullSecrets:
        - name: dockerhub
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: panel
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
